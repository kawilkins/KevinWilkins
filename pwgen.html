<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <link rel="icon" type="image/x-icon" href="images/wilkins_logo.png">

        <link rel="stylesheet" type="text/css" href="css/global.css">
        <link rel="stylesheet" type="text/css" href="css/side_nav.css">

        <script src="javascript/global.js" defer></script>
        <script src="javascript/side_nav.js" defer></script>
        <script src="apps/passwd/pwgen.js" defer></script>

        <title>Kevin Wilkins / Password Generator</title>
    </head>
    <body class="main">
        <side-nav></side-nav>
        <div class="content">
            <h1>Password Generator</h1>
            <i>v0.2.1</i>
            <form id="passwordGeneratorForm" class="form">
                <label for="characterAmountNumber">Password Length</label>
                <div>
                <input type="range" min="9" max="48" value="10" id="characterAmountRange">
                <input type="number" min="9" max="48" value="16" id="characterAmountNumber">
                </div>
                <label for="includeUppercase">Use Uppercase</label>
                <input type="checkbox" id="includeUppercase">
                <br>
                <label for="includeNumbers">Use Numbers</label>
                <input type="checkbox" id="includeNumbers">
                <br>
                <label for="includeSymbols">Use Symbols</label>
                <input type="checkbox" id="includeSymbols">
                <br>
                <button type="submit" class="btn">Generate Password</button>
                <br>
            </form>
            <br><br>
            <font style="font-family: Arial, Helvetica, sans-serif; font-size: 12pt;">Your generated password:  </font><span id="passwordDisplay" style="font-family: monospace; font-size: 12pt;">password</span>
        </div>
    </body>
</html>
